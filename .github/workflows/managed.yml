name: managed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build LibreDWGBlockGenerator.slnx --configuration Release
      - run: dotnet run --project tests/LibreDWG.BlockGenerator.SmokeTests --configuration Release --no-build

